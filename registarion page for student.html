<!DOCTYPE html>
<html>
<head>
<title>Enrollment</title>
<style>
 body{font-family:Arial;background:#e8edff;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;}
 .box{background:#fff;padding:20px;border-radius:8px;width:260px;text-align:center;}
 input,select,button{width:100%;padding:8px;margin:5px 0;border:1px solid #ccc;border-radius:5px;}
 button{background:#4e73df;color:#fff;border:none;}
</style>
</head>

<body>
<div class="box">
  <h3>Enroll</h3>
  <input type="text" placeholder="Name">
  <input type="text" placeholder="Student ID">
  <select><option>Class</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option></select>
  <button>Submit</button>
</div>
</body>
</html>
