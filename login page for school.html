<!DOCTYPE html>
<html>
<head>
<title>School Login</title>
<style>
  body{font-family:Arial;background:#dfe6f7;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;}
  .box{background:#fff;padding:20px;border-radius:8px;width:250px;text-align:center;}
  input,button{width:100%;padding:8px;margin:6px 0;border-radius:4px;border:1px solid #aaa;}
  button{background:#4e73df;color:#fff;border:none;}
</style>
</head>

<body>
<div class="box">
  <h3>Login</h3>
  <input type="text" placeholder="Student ID">
  <input type="password" placeholder="Password">
  <button>Login</button>
</div>
</body>
</html>
