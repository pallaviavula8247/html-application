<html>
<head>
<title>form tag</title>
</head>
<body>
<h1>application form</h1>
<form>
<fieldset>
<legend>personal information </legend>
<input type="text" name="text search" value="enter the first name required"><br>
<input type="text" name="text search" value="enter the middle name required"><br>
</fieldset>
<fieldset>
<legend>personal details</legend>
datatime<input type="datatime"><br>
email<input type="email"><br>
number<input type="number"><br>
range<input type="range"<br>
month<input type="month"<br>
search<input type="search"<br>
</fieldset>
<fieldset>
<legend>password information </legend>
username<input type="username"><br>
password<input type="password"><br>
</fieldset>
<fieldset>
<legend>bio data</legend>
<input type="text" name="bio data"><br>
</fieldset>
<fieldset>
<legend>radio button</legend>
<input type="radio" name="branch" value="cse">cse<br>
<input type="radio" name="branch" value="ece">ece<br>
<input type="radio" name="branch" value="eee">eee<br>
<input type="radio" name="branch" value="ai">ai<br>
</fieldset>
<fieldset>
<legend>checkbox</legend>
<input type="checkbox" name="tabindex" value="1">1<br>
<input type="checkbox" name="tabindex" value="2">2<br>
<input type="checkbox" name="tabindex" value="3">3<br>
<input type="checkbox" name="tabindex" value="4">4<br>
</fieldset>
<button type="submit"></button>
<input type="submit"></button>
<button type="reset"></button>
<input type="reset"></button>
<form>
</html>
